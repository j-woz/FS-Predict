name: Test server start and quit

on:
  push:
  pull_request:

jobs:
  test-server-quit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: fs-predict-tft
          python-version: "3.11"
          auto-activate-base: false

      - name: Install environment
        shell: bash -l {0}
        run: |
          conda activate fs-predict-tft
          echo CONDA_PREFIX=$CONDA_PREFIX
          conda env update --quiet -f service/environment-deploy.yml

      - name: Start server in background
        shell: bash -l {0}
        working-directory: service
        run: |
          conda activate fs-predict-tft
          echo CONDA_PREFIX=$CONDA_PREFIX
          python server.py -m rng -s /tmp/xfer-test.s &
          echo $! > /tmp/server.pid

      - name: Wait for socket
        shell: bash -l {0}
        run: |
          FOUND=0
          for i in $(seq 1 15)
          do
            if [[ -S /tmp/xfer-test.s ]]
            then
              echo "Socket found."
              FOUND=1
              break
            fi
            echo "Waiting for socket... ($i)"
            sleep 1
          done
          if (( ! FOUND ))
          then
            echo "ERROR: server socket did not appear"
            exit 1
          fi
          echo "SUCCESS."

      - name: Quit via client
        shell: bash -l {0}
        working-directory: service
        run: |
          conda activate fs-predict-tft
          echo CONDA_PREFIX=$CONDA_PREFIX
          timeout 10s python client.py -s /tmp/xfer-test.s quit
          CODE=$?
          if (( CODE == 124 ))
          then
            echo "ERROR: client timed out waiting for server response"
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            exit 1
          elif (( CODE != 0 ))
          then
            echo "ERROR: Other error code: $CODE"
            exit 1
          fi
          echo "SUCCESS."

      - name: Wait for server to exit
        run: |
          pid=$(cat /tmp/server.pid)
          for i in $(seq 1 10)
          do
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          if kill -0 $pid 2>/dev/null
          then
            echo "ERROR: server did not exit after quit, killing it"
            kill $pid 2>/dev/null || true
            exit 1
          fi
          echo "Server exited."
